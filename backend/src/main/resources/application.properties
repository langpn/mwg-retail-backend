spring.application.name=demojpa
spring.profiles.active=dev
server.port=8088

# ============================================================
#  CAU HINH KET NOI DATABASE MySQL
# ============================================================
# URL ket noi: jdbc:mysql://host:port/ten_database
spring.datasource.url=jdbc:mysql://localhost:3306/jpa_demo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# Tai khoan MySQL cua ban (thay doi neu can)
spring.datasource.username=root
spring.datasource.password=172004

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  CAU HINH JPA / HIBERNATE
# ============================================================
# Chien luoc quan ly schema (QUAN TRONG):
#   - create       : Xoa bang cu, tao bang moi moi lan chay (mat du lieu!)
#   - create-drop  : Tao bang khi start, xoa bang khi stop
#   - update       : Tu dong cap nhat cau truc bang (KHUYEN DUNG khi hoc)
#   - validate     : Chi kiem tra cau truc, khong thay doi gi
#   - none         : Khong lam gi ca
spring.jpa.hibernate.ddl-auto=update

# In ra cac cau lenh SQL duoc thuc thi (huu ich khi debug)
spring.jpa.show-sql=true

# Dinh dang SQL de doc de hon
spring.jpa.properties.hibernate.format_sql=true

# Noi dialect (phien ban SQL) de su dung - Hibernate tu phat hien
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
