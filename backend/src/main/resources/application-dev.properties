# Profile Dev: Dung H2 Database in-memory chay offline cuc bo
spring.datasource.url=jdbc:h2:mem:mwg_retail_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bat buoc dung H2Dialect de khong bi loi engine=InnoDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.h2.console.enabled=true
